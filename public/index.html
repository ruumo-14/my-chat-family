<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINE風 チャット</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; background: #cbd4e1; overflow: hidden; }
        .hidden { display: none !important; }
        #login-screen { max-width: 400px; margin: 100px auto; background: white; padding: 30px; border-radius: 10px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        #login-screen input, #login-screen button { width: 100%; padding: 12px; margin-bottom: 15px; box-sizing: border-box; border-radius: 6px; font-size: 16px; }
        #login-screen button { background: #06c755; color: white; border: none; font-weight: bold; cursor: pointer; }
        #main-screen { display: flex; width: 100vw; height: 100vh; background: #fff; }
        #sidebar { width: 250px; background: #eceff1; border-right: 1px solid #cfd8dc; display: flex; flex-direction: column; }
        #my-profile { padding: 15px; background: #2c3e50; color: white; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        #logout-btn { background: #e74c3c; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; }
        #add-friend-form { padding: 10px; display: flex; gap: 5px; background: #fff; border-bottom: 1px solid #cfd8dc; }
        #add-friend-form input { flex: 1; padding: 6px; border: 1px solid #ccc; border-radius: 4px; }
        #add-friend-form button { padding: 6px 10px; background: #2c3e50; color: white; border: none; border-radius: 4px; cursor: pointer; }
        #user-list-title { padding: 10px 15px; font-size: 12px; color: #78909c; font-weight: bold; }
        #user-list { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
        #user-list li { padding: 15px; border-bottom: 1px solid #e0e0e0; cursor: pointer; display: flex; justify-content: space-between; }
        #user-list li.active { background: #06c755; color: white; }
        .status-dot { font-size: 11px; color: #888; }
        .status-dot.online { color: #06c755; font-weight: bold; }
        li.active .status-dot.online { color: #fff; }
        #chat-area { flex: 1; display: flex; flex-direction: column; background: #7493a7; }
        #chat-header { padding: 15px; background: #ffffff; border-bottom: 1px solid #cfd8dc; font-weight: bold; }
        #chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg-row { display: flex; width: 100%; }
        .msg-row.me { justify-content: flex-end; }
        .msg-row.other { justify-content: flex-start; }
        .bubble { max-width: 60%; padding: 10px 14px; border-radius: 15px; font-size: 15px; word-wrap: break-word; }
        .msg-row.me .bubble { background: #84e296; border-top-right-radius: 2px; }
        .msg-row.other .bubble { background: #ffffff; border-top-left-radius: 2px; }
        .time { font-size: 11px; color: #666; align-self: flex-end; margin: 0 5px; }
        #input-area { padding: 15px; background: #ffffff; display: flex; gap: 10px; }
        #message-input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 20px; outline: none; }
        #send-btn { padding: 10px 20px; background: #06c755; color: white; border: none; border-radius: 20px; font-weight: bold; cursor: pointer; }
        #no-chat-placeholder { flex: 1; display: flex; justify-content: center; align-items: center; color: #ffffff; font-size: 18px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="login-screen">
        <h2>💬 LINE風 チャット (自動ログイン)</h2>
        <input type="text" id="username-input" placeholder="ユーザーIDを入力" required>
        <button id="login-btn">ログイン</button>
    </div>

    <div id="main-screen" class="hidden">
        <div id="sidebar">
            <div id="my-profile">
                <div>マイID: <span id="my-id-display"></span></div>
                <button id="logout-btn">ログアウト</button>
            </div>
            <div id="add-friend-form">
                <input type="text" id="friend-id-input" placeholder="話したい相手のID">
                <button id="add-friend-btn">トーク開始</button>
            </div>
            <div id="user-list-title">トークルーム一覧</div>
            <ul id="user-list"></ul>
        </div>
        <div id="no-chat-placeholder">👈 話したい相手のIDを入力するか、リストから選んでね</div>
        <div id="chat-area" class="hidden">
            <div id="chat-header">トーク相手: <span id="chat-partner-name"></span></div>
            <div id="chat-box"></div>
            <div id="input-area">
                <input type="text" id="message-input" placeholder="メッセージを入力...">
                <button id="send-btn">送信</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io({ transports: ['websocket', 'polling'] });
        let myUsername = '', activePartner = '', chatLogs = {}, onlineUsersList = [];

        window.addEventListener('DOMContentLoaded', () => {
            const savedUsername = localStorage.getItem('chat_my_id');
            if (savedUsername) socket.emit('login', savedUsername);
        });

        document.getElementById('login-btn').addEventListener('click', () => {
            const username = document.getElementById('username-input').value.trim();
            if (!username) return alert('ユーザーIDを入力してください');
            socket.emit('login', username);
        });

        socket.on('loginResult', (data) => {
            if (data.success) {
                myUsername = data.username;
                localStorage.setItem('chat_my_id', myUsername);
                document.getElementById('my-id-display').innerText = myUsername;
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('main-screen').classList.remove('hidden');
            } else {
                alert(data.message);
                localStorage.removeItem('chat_my_id');
            }
        });

        document.getElementById('logout-btn').addEventListener('click', () => {
            if (confirm('ログアウトしますか？')) {
                localStorage.removeItem('chat_my_id');
                location.reload();
            }
        });

        socket.on('loadChatHistory', (history) => {
            chatLogs = {};
            history.forEach(msg => {
                const partner = (msg.fromUser === myUsername) ? msg.toUser : msg.fromUser;
                if (!chatLogs[partner]) chatLogs[partner] = [];
                chatLogs[partner].push(msg);
            });
            updateSidebarList(); 
        });

        socket.on('userList', (userArray) => {
            onlineUsersList = userArray;
            updateSidebarList();
        });

        document.getElementById('add-friend-btn').addEventListener('click', () => {
            const friendId = document.getElementById('friend-id-input').value.trim();
            if (!friendId) return alert('相手のIDを入力してください');
            if (friendId === myUsername) return alert('自分自身とはチャットできません');
            if (!chatLogs[friendId]) chatLogs[friendId] = []; 
            updateSidebarList();
            switchChatPartner(friendId);
            document.getElementById('friend-id-input').value = '';
        });

        function updateSidebarList() {
            const userListEl = document.getElementById('user-list');
            userListEl.innerHTML = '';
            Object.keys(chatLogs).forEach(partner => {
                const li = document.createElement('li');
                li.innerText = partner;
                if (partner === activePartner) li.classList.add('active');
                const isOnline = onlineUsersList.includes(partner);
                const dot = document.createElement('span');
                dot.className = 'status-dot ' + (isOnline ? 'online' : '');
                dot.innerText = isOnline ? ' ● 接続中' : ' ○ 離席中';
                li.appendChild(dot);
                li.addEventListener('click', () => switchChatPartner(partner));
                userListEl.appendChild(li);
            });
        }

        function switchChatPartner(partner) {
            activePartner = partner;
            document.getElementById('no-chat-placeholder').classList.add('hidden');
            document.getElementById('chat-area').classList.remove('hidden');
            document.getElementById('chat-partner-name').innerText = partner;
            updateSidebarList();
            renderMessages();
        }

        function renderMessages() {
            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML = '';
            const logs = chatLogs[activePartner] || [];
            logs.forEach(msg => {
                const isMe = (msg.fromUser === myUsername);
                const row = document.createElement('div');
                row.className = `msg-row ${isMe ? 'me' : 'other'}`;
                const bubble = document.createElement('div');
                bubble.className = 'bubble';
                bubble.innerText = msg.text;
                const timeSpan = document.createElement('span');
                timeSpan.className = 'time';
                timeSpan.innerText = msg.time || '';
                row.appendChild(bubble);
                row.appendChild(timeSpan);
                chatBox.appendChild(row);
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        document.getElementById('send-btn').addEventListener('click', sendMessage);
        document.getElementById('message-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text || !activePartner) return;
socket.emit('privateMessage', { toUser: activePartner, text: text });
input.value = '';
}
socket.on('receivePrivateMessage', (msg) => {
const partner = (msg.fromUser === myUsername) ? msg.toUser : msg.fromUser;
if (!chatLogs[partner]) chatLogs[partner] = [];
chatLogs[partner].push(msg);
updateSidebarList();
if (partner === activePartner) renderMessages();
});
