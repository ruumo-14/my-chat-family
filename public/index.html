<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINE風 プライベートチャット（自動ログイン対応）</title>
    <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; margin: 0; padding: 0; background: #cbd4e1; overflow: hidden; }
        .hidden { display: none !important; }
        
        #login-screen { max-width: 400px; margin: 100px auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        #login-screen input { width: 100%; padding: 12px; margin-bottom: 15px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
        #login-screen button { width: 100%; padding: 12px; background: #06c755; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; }

        #main-screen { display: flex; width: 100vw; height: 100vh; background: #fff; }
        #sidebar { width: 250px; background: #eceff1; border-right: 1px solid #cfd8dc; display: flex; flex-direction: column; }
        
        #my-profile { padding: 15px; background: #2c3e50; color: white; font-weight: bold; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
        #logout-btn { background: #e74c3c; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; }
        #logout-btn:hover { background: #c0392b; }

        #user-list-title { padding: 10px 15px; font-size: 12px; color: #78909c; font-weight: bold; border-bottom: 1px solid #cfd8dc; }
        
        #add-friend-form { padding: 10px; display: flex; gap: 5px; background: #fff; border-bottom: 1px solid #cfd8dc; }
        #add-friend-form input { flex: 1; padding: 6px; border: 1px solid #ccc; border-radius: 4px; }
        #add-friend-form button { padding: 6px 10px; background: #2c3e50; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; }

        #user-list { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
        #user-list li { padding: 15px; border-bottom: 1px solid #e0e0e0; cursor: pointer; transition: 0.2s; font-weight: 500; display: flex; justify-content: space-between; }
        #user-list li:hover { background: #cfd8dc; }
        #user-list li.active { background: #06c755; color: white; }
        .status-dot { font-size: 11px; color: #888; }
        .status-dot.online { color: #06c755; font-weight: bold; }
        li.active .status-dot.online { color: #fff; }

        #chat-area { flex: 1; display: flex; flex-direction: column; background: #7493a7; }
        #chat-header { padding: 15px; background: #ffffff; border-bottom: 1px solid #cfd8dc; font-weight: bold; font-size: 18px; }
        #chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        
        .msg-row { display: flex; width: 100%; }
        .msg-row.me { justify-content: flex-end; }
        .msg-row.other { justify-content: flex-start; }
        .bubble { max-width: 60%; padding: 10px 14px; border-radius: 15px; font-size: 15px; line-height: 1.4; word-wrap: break-word; }
        .msg-row.me .bubble { background: #84e296; color: #000; border-top-right-radius: 2px; }
        .msg-row.other .bubble { background: #ffffff; color: #000; border-top-left-radius: 2px; }
        .time { font-size: 11px; color: #e0e0e0; align-self: flex-end; margin: 0 5px; }
        .msg-row.me .time { order: -1; color: #f0f0f0; }

        #input-area { padding: 15px; background: #ffffff; display: flex; gap: 10px; border-top: 1px solid #cfd8dc; }
        #message-input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 20px; font-size: 15px; outline: none; }
        #send-btn { padding: 10px 20px; background: #06c755; color: white; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; }
        #no-chat-placeholder { flex: 1; display: flex; justify-content: center; align-items: center; color: #ffffff; font-size: 18px; font-weight: bold; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <!-- 1. ログイン画面 -->
    <div id="login-screen">
        <h2>💬 LINE風 チャット (自動ログイン)</h2>
        <input type="text" id="username-input" placeholder="ユーザーIDを入力（例: taro）" required>
        <button id="login-btn">ログイン</button>
    </div>

    <!-- 2. メイン画面 -->
    <div id="main-screen" class="hidden">
        <div id="sidebar">
            <div id="my-profile">
                <div>マイID: <span id="my-id-display"></span></div>
                <button id="logout-btn">ログアウト</button>
            </div>
            
            <div id="add-friend-form">
                <input type="text" id="friend-id-input" placeholder="話したい相手のID">
                <button id="add-friend-btn">トーク開始</button>
            </div>
            
            <div id="user-list-title">トークルーム一覧</div>
            <ul id="user-list"></ul>
        </div>

        <div id="no-chat-placeholder">👈 話したい相手のIDを入力するか、リストから選んでね</div>
        
        <div id="chat-area" class="hidden">
            <div id="chat-header">トーク相手: <span id="chat-partner-name"></span></div>
            <div id="chat-box"></div>
            <div id="input-area">
                <input type="text" id="message-input" placeholder="メッセージを入力...">
                <button id="send-btn">送信</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        
        let myUsername = '';
        let activePartner = ''; 
        let chatLogs = {};      
        let onlineUsersList = [];

        window.addEventListener('DOMContentLoaded', () => {
            const savedUsername = localStorage.getItem('chat_my_id');
            if (savedUsername) {
                socket.emit('login', savedUsername);
            }
        });

        document.getElementById('login-btn').addEventListener('click', () => {
            const username = document.getElementById('username-input').value.trim();
            if (!username) return alert('ユーザーIDを入力してください');
            socket.emit('login', username);
        });

        socket.on('loginResult', (data) => {
            if (data.success) {
                myUsername = data.username;
                localStorage.setItem('chat_my_id', myUsername);
                document.getElementById('my-id-display').innerText = myUsername;
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('main-screen').classList.remove('hidden');
            } else {
                alert(data.message);
                localStorage.removeItem('chat_my_id');
            }
        });

        document.getElementById('logout-btn').addEventListener('click', () => {
            if (confirm('ログアウトしますか？自動ログインが解除されます。')) {
                localStorage.removeItem('chat_my_id');
                location.reload();
            }
        });

        socket.on('loadChatHistory', (history) => {
            chatLogs = {};
            history.forEach(msg => {
                const partner = (msg.fromUser === myUsername) ? msg.toUser : msg.fromUser;
                if (!chatLogs[partner]) chatLogs[partner] = [];
                chatLogs[partner].push(msg);
            });
            updateSidebarList(); 
        });

        socket.on('userList', (userArray) => {
            onlineUsersList = userArray;
            updateSidebarList();
        });

        document.getElementById('add-friend-btn').addEventListener('click', () => {
            const friendId = document.getElementById('friend-id-input').value.trim();
            if (!friendId) return alert('相手のIDを入力してください');
            if (friendId === myUsername) return alert('自分自身とはチャットできません');
            
            if (!chatLogs[friendId]) {
                chatLogs[friendId] = []; 
            }
            updateSidebarList();
            switchChatPartner(friendId);
            document.getElementById('friend-id-input').value = '';
        });

        function updateSidebarList() {
            const userListUl = document.getElementById('user-list');
            userListUl.innerHTML = '';

            Object.keys(chatLogs).forEach(user => {
                const li = document.createElement('li');
                li.innerText = user;
                if (user === activePartner) li.classList.add('active');

                const isOnline = onlineUsersList.includes(user);
                const statusSpan = document.createElement('span');
                statusSpan.classList.add('status-dot');
                if (isOnline) {
                    statusSpan.classList.add('online');
                    statusSpan.innerText = '● オンライン';
                } else {
                    statusSpan.innerText = '✕ オフライン';
                }
                li.appendChild(statusSpan);

                li.addEventListener('click', () => {
                    switchChatPartner(user);
                });
                userListUl.appendChild(li);
            });
        }

        function switchChatPartner(partnerName) {
            activePartner = partnerName;
            document.getElementById('no-chat-placeholder').classList.add('hidden');
            document.getElementById('chat-area').classList.remove('hidden');
            document.getElementById('chat-partner-name').innerText = partnerName;
            
            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML = '';
            
            if (chatLogs[partnerName]) {
                chatLogs[partnerName].forEach(msg => renderMessage(msg));
            }
            chatBox.scrollTop = chatBox.scrollHeight;
            updateSidebarList();
        }

        function renderMessage(msg) {
